<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - PropMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
		<div class="brand">
			<img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
			<span class="site-title">PropMatch</span>
		</div>
	</header>

    <main>
        <h1>Login</h1>
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
    </main>
    <footer>
        <p>© 2025 Rental Portal. All rights reserved.</p>
        <p>Connect with us: <a href="#">Facebook</a> | <a href="#">Twitter</a> | <a href="#">LinkedIn</a></p>
    </footer>
</body>
</html>
