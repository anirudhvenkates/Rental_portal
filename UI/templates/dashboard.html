<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PropMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
            <span class="site-title">PropMatch</span>
        </div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main>
        <h1>Welcome, {{ name }}!</h1>
        <p>Your role is: {{ role }}</p>

        <h2>Available Operations</h2>
        <form method="POST" action="{{ url_for('perform_operation') }}" enctype="multipart/form-data">
            <select name="operation" id="operation_select" required>
                {% for op in operations %}
                    <option value="{{ op }}">{{ op }}</option>
                {% endfor %}
            </select>

            <!-- Staff: Store house image -->
            <div id="store-house-image-details" style="display: none; margin-top: 10px;">
                <label for="file_upload">Choose File:</label>
                <input type="file" id="file_upload" name="file_upload"><br><br>

                <label for="house_type">House Type:</label>
                <input type="text" id="house_type" name="house_type" placeholder="apartment, villa, etc."><br><br>

                <label for="bedrooms">Bedrooms:</label>
                <input type="number" id="bedrooms" name="bedrooms" placeholder="3"><br><br>
            </div>

            <!-- Default for all other operations -->
            <div id="default-text-container" style="display: none; margin-top: 10px;">
                <label for="default_info">Enter file information or property query:</label>
                <input type="text" id="default_info" name="file_info" placeholder="Enter details">
            </div>

            <button type="submit" style="margin-top: 10px;">Perform Operation</button>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>© 2025 Rental Portal. All rights reserved.</p>
            <p>Developed by Anirudh Venkatesh</p>
            <p>Project on <a href="https://github.com/anirudhvenkates/PropMatch" target="_blank">
                <strong><u>GitHub</u></strong></a></p>
            <p>Connect with us: <a href="#">Facebook</a> | <a href="#">Twitter</a> | <a href="#">LinkedIn</a></p>
        </div>
    </footer>

    <script>
        function updateFormFields() {
            const operation = document.getElementById('operation_select').value;
            const storeDetails = document.getElementById('store-house-image-details');
            const defaultContainer = document.getElementById('default-text-container');

            if (operation.includes("Store a House Image")) {
                storeDetails.style.display = 'block';
                defaultContainer.style.display = 'none';
            } else {
                storeDetails.style.display = 'none';
                defaultContainer.style.display = 'block';
            }
        }

        document.getElementById('operation_select').addEventListener('change', updateFormFields);
        window.onload = updateFormFields;
    </script>
</body>
</html>
