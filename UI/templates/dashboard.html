<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PropMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="brand">
			<img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
			<span class="site-title">PropMatch</span>
		</div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <main>
        <h1>Welcome, {{ name }}!</h1>
        <p>Your role is: {{ role }}</p>
        <h2>Available Operations</h2>
        <form method="POST" action="{{ url_for('perform_operation') }}" enctype="multipart/form-data">
            <select name="operation" id="operation_select">
                {% for op in operations %}
                <option value="{{ op }}">{{ op }}</option>
                {% endfor %}
            </select>
            
            <!-- Container for file upload (used for "Store a file") -->
            <div id="file-upload-container" style="display: none; margin-top:10px;">
                <label for="file_input">Choose file:</label>
                <input type="file" id="file_input" name="file_input">
            </div>
            
            <!-- Container for text input (used for "Delete a file" or "Output file data") -->
            <div id="file-text-container" style="display: none; margin-top:10px;">
                <label for="file_text">Enter file name:</label>
                <input type="text" id="file_text" name="file_info" placeholder="Enter file name">
            </div>
            
            <!-- Hidden input to hold the file name from file upload -->
            <input type="hidden" id="hidden_file_info" name="file_info">
            
            <button type="submit" style="margin-top:10px;">Perform Operation</button>
        </form>
    </main>
    <footer>
        <div class="container">
            <p>© 2025 Rental Portal. All rights reserved.</p>
			<p>Developed by Anirudh Venkatesh</p>
			<p>Project on <a href="https://github.com/anirudhvenkates/PropMatch" target="_blank"><strong><u>GitHub</u></strong></a></p>
            <p>Connect with us: <a href="#">Facebook</a> | <a href="#">Twitter</a> | <a href="#">LinkedIn</a></p>
        </div>
    </footer>

    <script>
        function updateFormFields() {
            var operation = document.getElementById('operation_select').value.toLowerCase();
            var fileUploadContainer = document.getElementById('file-upload-container');
            var fileTextContainer = document.getElementById('file-text-container');
            var fileInput = document.getElementById('file_input');
            var fileText = document.getElementById('file_text');
            var hiddenFileInfo = document.getElementById('hidden_file_info');
            
            // Hide and disable both input fields by default.
            fileUploadContainer.style.display = 'none';
            fileTextContainer.style.display = 'none';
            fileInput.disabled = true;
            fileText.disabled = true;
            hiddenFileInfo.disabled = true;
            
            // If "Store a file" is selected, show the file chooser.
            if (operation.includes('store a file')) {
                fileUploadContainer.style.display = 'block';
                fileInput.disabled = false;
                hiddenFileInfo.disabled = false;
            }
            // If "Delete a file" or "Output file data" is selected, show the text input.
            else if (operation.includes('delete a file') || operation.includes('output file data')) {
                fileTextContainer.style.display = 'block';
                fileText.disabled = false;
            }
            // For "Retrieve file" (or any other operation), no additional field is required.
        }

        document.getElementById('operation_select').addEventListener('change', updateFormFields);
        updateFormFields(); // initialize on page load

        // When a file is chosen for "Store a file", copy its name into the hidden input.
        document.getElementById('file_input').addEventListener('change', function(){
            var hiddenFileInfo = document.getElementById('hidden_file_info');
            if(this.files.length > 0){
                hiddenFileInfo.value = this.files[0].name;
            } else {
                hiddenFileInfo.value = '';
            }
        });
    </script>
</body>
</html>
